<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!--
    viewport-fit=cover  -> aprovecha toda la pantalla en móviles con muesca
    user-scalable=no    -> evita que un doble toque haga zoom en mitad de una partida
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05040B">
  <meta name="description"
        content="Cosmic Coffee Defenders: un arcade espacial en el que una taza de café defiende el universo. Juego de navegador, gratis y sin instalar nada.">

  <title>Cosmic Coffee Defenders</title>

  <link rel="stylesheet" href="style.css">
  <!-- Icono dibujado en el propio HTML: una taza. Sin archivos externos. -->
  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2305040B'/><path d='M9 11h14l-2 12H11z' fill='%23F4F7FB'/><ellipse cx='16' cy='11' rx='7' ry='2.5' fill='%234A2C17'/><path d='M23 13a4 4 0 0 1 0 7' stroke='%233FD2FF' stroke-width='2' fill='none'/></svg>">
</head>
<body>
  <!-- El lienzo del juego. Todo se dibuja aquí dentro. -->
  <canvas id="juego" aria-label="Cosmic Coffee Defenders" role="img"></canvas>

  <!-- Aviso para quien tenga JavaScript desactivado. -->
  <noscript>
    <p class="sin-js">
      Este juego necesita JavaScript activado para funcionar.
    </p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
